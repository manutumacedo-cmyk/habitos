<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<title>Hábitos</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 16px 40px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 17px;
    background: #f4f5f7;
    color: #1b1f24;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  h2 { font-size: 17px; margin: 0 0 10px; }
  section {
    background: #fff;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .grupo { color: #5a6270; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; margin: 4px 0 8px; }
  .fila {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 56px;
  }
  .fila + .fila { border-top: 1px solid #eceef1; }
  .grupo-noche { margin-top: 14px; }
  input[type="time"], input[type="number"] {
    font: inherit;
    font-size: 20px;
    padding: 8px 10px;
    border: 1px solid #c9ced6;
    border-radius: 10px;
    background: #fff;
    color: inherit;
    min-height: 46px;
  }
  input[type="time"] { width: 130px; }
  .check {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 56px;
    cursor: pointer;
  }
  .check input { width: 30px; height: 30px; margin: 0; accent-color: #1f7a3f; }
  .contador { display: flex; align-items: center; gap: 8px; }
  .contador button {
    width: 46px; height: 46px;
    font-size: 24px;
    border: none;
    border-radius: 10px;
    background: #e3e7ec;
    color: inherit;
  }
  .contador input { width: 64px; text-align: center; }
  .tope { font-size: 14px; color: #5a6270; min-height: 20px; padding-bottom: 6px; }
  .tope.ok { color: #1f7a3f; }
  .tope.mal { color: #b3261e; }
  .racha { font-size: 20px; font-weight: 600; }
  .aviso {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: #fdecea;
    color: #8c1d18;
    font-weight: 600;
  }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 14px; }
  th, td { padding: 8px 2px; text-align: center; border-bottom: 1px solid #eceef1; }
  th { font-size: 12px; color: #5a6270; font-weight: 600; }
  td:first-child, th:first-child { text-align: left; }
  col.c-dia { width: 24%; }
  col.c-hora { width: 19%; }
  col.c-est { width: 14%; }
  col.c-lol { width: 24%; }
  tr.hoy td { font-weight: 700; }
  .si { color: #1f7a3f; }
  .no { color: #b3261e; }
  .vacio { color: #9aa1ab; }
  .boton {
    display: block;
    width: 100%;
    margin-top: 12px;
    min-height: 50px;
    font: inherit;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    background: #1f3a5f;
    color: #fff;
  }
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .cabecera h1 { margin: 0; }
  .cabecera.ayer h1 { color: #8a5a00; }
  .boton-sec {
    flex-shrink: 0;
    min-height: 44px;
    padding: 0 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #e3e7ec;
    color: inherit;
  }
  .estado { font-size: 14px; color: #5a6270; text-align: center; min-height: 20px; margin-top: 6px; }
  ol { margin: 0; padding-left: 22px; }
  ol li + li { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <div class="cabecera">
    <h1 id="fecha"></h1>
    <button type="button" class="boton-sec" id="cambiar-dia">Ver ayer</button>
  </div>

  <section>
    <div class="grupo">A la mañana</div>
    <div class="fila">
      <label for="acoste">Anoche me acosté a las</label>
      <input type="time" id="acoste">
    </div>
    <div class="fila">
      <label for="levante">Me levanté a las</label>
      <input type="time" id="levante">
    </div>

    <div class="grupo grupo-noche">A la noche</div>
    <div class="fila">
      <label class="check"><input type="checkbox" id="estudio"> Bloque de estudio cumplido</label>
    </div>
    <div class="fila">
      <label for="lol">Partidas de LoL</label>
      <div class="contador">
        <button type="button" id="lol-menos" aria-label="Una partida menos">−</button>
        <input type="number" id="lol" inputmode="numeric" min="0" step="1">
        <button type="button" id="lol-mas" aria-label="Una partida más">+</button>
      </div>
    </div>
    <div class="tope" id="tope"></div>
  </section>

  <section>
    <div class="racha" id="racha"></div>
    <div class="aviso" id="aviso" hidden>Ayer fallaste el estudio: hoy no falles dos veces.</div>
  </section>

  <section>
    <h2>Últimos 7 días</h2>
    <table>
      <colgroup>
        <col class="c-dia"><col class="c-hora"><col class="c-hora"><col class="c-est"><col class="c-lol">
      </colgroup>
      <thead>
        <tr><th>Día</th><th>Acosté</th><th>Levanté</th><th>Est.</th><th>LoL</th></tr>
      </thead>
      <tbody id="tabla"></tbody>
    </table>
    <button type="button" class="boton" id="copiar">Copiar resumen de la semana</button>
    <div class="estado" id="estado-copia"></div>
  </section>

  <section>
    <h2>Las 4 leyes del cambio de conducta</h2>
    <ol id="leyes"></ol>
  </section>
</main>

<script>
// ===== EDITABLE =====
// Máximo de partidas de LoL por día. null = todavía sin definir.
const TOPE_LOL = null;

// Tus 4 leyes aplicadas a tu plan. Reemplazá el texto entre comillas.
const LEYES = [
  "[1. Hacerlo obvio → ESCRIBÍ ACÁ tu señal concreta, ej: cuándo y dónde estudiás]",
  "[2. Hacerlo atractivo → ESCRIBÍ ACÁ cómo lo vas a hacer atractivo]",
  "[3. Hacerlo sencillo → ESCRIBÍ ACÁ cómo reducís la fricción para empezar]",
  "[4. Hacerlo satisfactorio → ESCRIBÍ ACÁ cuál es tu recompensa inmediata]"
];
// ====================

const CLAVE = "habitos-v1";
const DIAS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];

function cargar() {
  try {
    const datos = JSON.parse(localStorage.getItem(CLAVE));
    return datos && typeof datos === "object" ? datos : {};
  } catch (e) {
    return {};
  }
}

function guardar() {
  try {
    localStorage.setItem(CLAVE, JSON.stringify(datos));
  } catch (e) {
    alert("No se pudo guardar. ¿Estás en modo incógnito?");
  }
}

// Fecha local (no UTC) como "YYYY-MM-DD".
function clave(fecha) {
  const m = String(fecha.getMonth() + 1).padStart(2, "0");
  const d = String(fecha.getDate()).padStart(2, "0");
  return fecha.getFullYear() + "-" + m + "-" + d;
}

// Fecha de hace n días, a las 12:00 para esquivar cambios de horario.
function haceDias(n) {
  const f = new Date();
  f.setHours(12, 0, 0, 0);
  f.setDate(f.getDate() - n);
  return f;
}

function ddmm(fecha) {
  return String(fecha.getDate()).padStart(2, "0") + "/" + String(fecha.getMonth() + 1).padStart(2, "0");
}

let datos = cargar();
let hoy = clave(haceDias(0));
let viendoAyer = false;

// Día que muestra y edita el formulario: hoy o ayer.
function diaFormulario() {
  return viendoAyer ? clave(haceDias(1)) : hoy;
}

function registroFormulario() {
  const dia = diaFormulario();
  if (!datos[dia]) datos[dia] = {};
  return datos[dia];
}

function setCampo(campo, valor) {
  const r = registroFormulario();
  if (valor === "" || valor === null || valor === undefined) delete r[campo];
  else r[campo] = valor;
  guardar();
  render();
}

function respetoTope(lol) {
  if (TOPE_LOL === null || lol === undefined) return null;
  return lol <= TOPE_LOL;
}

function calcularRacha() {
  // Si hoy todavía no está marcado, la racha se cuenta desde ayer.
  let n = datos[hoy] && datos[hoy].estudio ? 0 : 1;
  let racha = 0;
  while (true) {
    const r = datos[clave(haceDias(n))];
    if (!r || !r.estudio) break;
    racha++;
    n++;
  }
  return racha;
}

function fallóAyer() {
  const ayer = clave(haceDias(1));
  const r = datos[ayer];
  if (r && r.estudio) return false;
  // Primer día de uso: no hay nada registrado antes de hoy.
  return Object.keys(datos).some(function (k) { return k < hoy; });
}

function celda(texto, clase) {
  const td = document.createElement("td");
  td.textContent = texto;
  if (clase) td.className = clase;
  return td;
}

function render() {
  const r = datos[diaFormulario()] || {};

  const titulo =
    haceDias(viendoAyer ? 1 : 0).toLocaleDateString("es-UY", { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("fecha").textContent =
    viendoAyer ? "Ayer, " + titulo : titulo.charAt(0).toUpperCase() + titulo.slice(1);
  document.querySelector(".cabecera").classList.toggle("ayer", viendoAyer);
  document.getElementById("cambiar-dia").textContent = viendoAyer ? "Volver a hoy" : "Ver ayer";

  // No pisar el campo mientras se está escribiendo en él.
  const activo = document.activeElement;
  const acoste = document.getElementById("acoste");
  const levante = document.getElementById("levante");
  const lol = document.getElementById("lol");
  if (activo !== acoste) acoste.value = r.acoste || "";
  if (activo !== levante) levante.value = r.levante || "";
  if (activo !== lol) lol.value = r.lol === undefined ? "" : String(r.lol);
  document.getElementById("estudio").checked = !!r.estudio;

  const tope = document.getElementById("tope");
  const ok = respetoTope(r.lol);
  if (TOPE_LOL === null) {
    tope.textContent = "Tope sin definir";
    tope.className = "tope";
  } else if (ok === null) {
    tope.textContent = "Tope: " + TOPE_LOL;
    tope.className = "tope";
  } else {
    tope.textContent = ok ? "✓ Respetaste el tope (" + TOPE_LOL + ")" : "✗ Pasaste el tope (" + TOPE_LOL + ")";
    tope.className = ok ? "tope ok" : "tope mal";
  }

  const racha = calcularRacha();
  document.getElementById("racha").textContent =
    "Racha de estudio: " + racha + (racha === 1 ? " día" : " días");
  document.getElementById("aviso").hidden = !fallóAyer();

  const tbody = document.getElementById("tabla");
  tbody.replaceChildren();
  for (let i = 6; i >= 0; i--) {
    const f = haceDias(i);
    const d = datos[clave(f)] || {};
    const tr = document.createElement("tr");
    if (i === 0) tr.className = "hoy";
    tr.appendChild(celda(DIAS[f.getDay()] + " " + f.getDate()));
    tr.appendChild(celda(d.acoste || "—", d.acoste ? "" : "vacio"));
    tr.appendChild(celda(d.levante || "—", d.levante ? "" : "vacio"));
    tr.appendChild(d.estudio ? celda("✓", "si") : celda("✗", i === 0 ? "vacio" : "no"));
    if (d.lol === undefined) {
      tr.appendChild(celda("—", "vacio"));
    } else {
      const t = respetoTope(d.lol);
      tr.appendChild(celda(d.lol + (t === null ? "" : t ? " ✓" : " ✗"), t === false ? "no" : ""));
    }
    tbody.appendChild(tr);
  }
}

function resumen() {
  const lineas = [];
  lineas.push("Semana " + ddmm(haceDias(6)) + " al " + ddmm(haceDias(0)));
  lineas.push("Racha de estudio: " + calcularRacha());
  lineas.push("Tope LoL: " + (TOPE_LOL === null ? "sin definir" : TOPE_LOL));
  lineas.push("");
  for (let i = 6; i >= 0; i--) {
    const f = haceDias(i);
    const d = datos[clave(f)] || {};
    const t = respetoTope(d.lol);
    lineas.push(
      DIAS[f.getDay()] + " " + ddmm(f) +
      " | acosté " + (d.acoste || "-") +
      " | levanté " + (d.levante || "-") +
      " | estudio " + (d.estudio ? "sí" : "no") +
      " | LoL " + (d.lol === undefined ? "-" : d.lol) +
      (t === null ? "" : t ? " (tope ok)" : " (tope pasado)")
    );
  }
  return lineas.join("\n");
}

function copiarFallback(texto) {
  const ta = document.createElement("textarea");
  ta.value = texto;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, texto.length);
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}

function avisarCopia(ok) {
  const el = document.getElementById("estado-copia");
  el.textContent = ok ? "Copiado ✓" : "No se pudo copiar";
  setTimeout(function () { el.textContent = ""; }, 2500);
}

document.getElementById("acoste").addEventListener("change", function (e) { setCampo("acoste", e.target.value); });
document.getElementById("levante").addEventListener("change", function (e) { setCampo("levante", e.target.value); });
document.getElementById("estudio").addEventListener("change", function (e) { setCampo("estudio", e.target.checked || ""); });

document.getElementById("lol").addEventListener("input", function (e) {
  const n = parseInt(e.target.value, 10);
  setCampo("lol", isNaN(n) || n < 0 ? "" : n);
});
document.getElementById("lol-menos").addEventListener("click", function () {
  const actual = registroFormulario().lol;
  setCampo("lol", actual === undefined ? 0 : Math.max(0, actual - 1));
});
document.getElementById("lol-mas").addEventListener("click", function () {
  const actual = registroFormulario().lol;
  setCampo("lol", actual === undefined ? 1 : actual + 1);
});

document.getElementById("copiar").addEventListener("click", function () {
  const texto = resumen();
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(
      function () { avisarCopia(true); },
      function () { avisarCopia(copiarFallback(texto)); }
    );
  } else {
    avisarCopia(copiarFallback(texto));
  }
});

document.getElementById("cambiar-dia").addEventListener("click", function () {
  viendoAyer = !viendoAyer;
  render();
});

// Si la app quedó abierta de un día para otro, pasar al día nuevo al volver.
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState !== "visible") return;
  const nueva = clave(haceDias(0));
  datos = cargar();
  if (nueva !== hoy) {
    hoy = nueva;
    viendoAyer = false;
    if (document.activeElement) document.activeElement.blur();
  }
  render();
});

const ol = document.getElementById("leyes");
LEYES.forEach(function (texto) {
  const li = document.createElement("li");
  li.textContent = texto;
  ol.appendChild(li);
});

render();
</script>
</body>
</html>
